name: Prepare upstream OpenCode update candidate

on:
  schedule:
    # Check the official OpenCode repository every six hours (UTC).
    # GitHub may start scheduled workflows a few minutes after the requested time.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prepare-upstream-candidate
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the locked source metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true

      - name: Resolve and verify the upstream source candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail

          CURRENT="$(python3 tools/ocver.py current)"
          UPSTREAM_REFS="$(git ls-remote --tags https://github.com/anomalyco/opencode.git 'refs/tags/v*')"
          read -r UPSTREAM_TAG TAG_VERSION UPSTREAM_SHA < <(printf '%s\n' "$UPSTREAM_REFS" | python3 tools/upstream_tags.py)
          [[ "$UPSTREAM_TAG" == "v$TAG_VERSION" && "$UPSTREAM_SHA" =~ ^[a-f0-9]{40}$ ]]

          # Prefer the root manifest, then fall back to the package workspace.
          PACKAGE_JSON=""
          if PACKAGE_JSON="$(curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --proto '=https' --proto-redir '=https' \
            "https://raw.githubusercontent.com/anomalyco/opencode/$UPSTREAM_SHA/package.json")"; then
            if ! python3 -c 'import json,sys; p=json.load(sys.stdin); assert isinstance(p.get("version"),str)' <<<"$PACKAGE_JSON" 2>/dev/null; then
              PACKAGE_JSON=""
            fi
          fi
          if [[ -z "$PACKAGE_JSON" ]]; then
            PACKAGE_JSON="$(curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --proto '=https' --proto-redir '=https' \
              "https://raw.githubusercontent.com/anomalyco/opencode/$UPSTREAM_SHA/packages/opencode/package.json")"
          fi

          VERSION="$(python3 -c 'import json,re,sys; v=json.load(sys.stdin)["version"]; assert re.fullmatch(r"[0-9]+[.][0-9]+[.][0-9]+",v), f"Unsupported upstream version: {v!r}"; print(v)' <<<"$PACKAGE_JSON")"
          [[ "$VERSION" == "$TAG_VERSION" ]] || {
            echo "Upstream tag $UPSTREAM_TAG points to a manifest declaring $VERSION, not $TAG_VERSION." >&2
            exit 1
          }

          UPDATE_AVAILABLE="$(python3 - "$CURRENT" "$VERSION" <<'PY'
          import re, sys
          current, candidate = sys.argv[1:]
          pattern = re.compile(r"[0-9]+[.][0-9]+[.][0-9]+")
          for value in (current, candidate):
              if not pattern.fullmatch(value):
                  raise SystemExit(f"Invalid semantic version: {value!r}")
          print("true" if tuple(map(int, candidate.split("."))) > tuple(map(int, current.split("."))) else "false")
          PY
          )"
          if [[ "$UPDATE_AVAILABLE" != "true" ]]; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## No newer upstream version"
              echo
              echo "The latest official upstream tag is $UPSTREAM_TAG ($VERSION); this repository is locked to $CURRENT."
              echo "No branch, pull request, lockfile change, or release was created."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ARCHIVE="$RUNNER_TEMP/opencode-source-$VERSION.tar.gz"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --proto '=https' --proto-redir '=https' \
            "https://codeload.github.com/anomalyco/opencode/tar.gz/$UPSTREAM_SHA" -o "$ARCHIVE"
          SOURCE_SHA256="$(sha256sum "$ARCHIVE" | cut -d ' ' -f1)"
          [[ "$SOURCE_SHA256" =~ ^[a-f0-9]{64}$ ]]

          mkdir -p candidate/upstream-source
          tar -xzf "$ARCHIVE" --strip-components=1 -C candidate/upstream-source
          FFF_VERSION="$(python3 - candidate/upstream-source/bun.lock <<'PY'
          import json, sys
          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          print(lock["workspaces"]["packages/core"]["dependencies"]["@ff-labs/fff-bun"])
          PY
          )"
          FFF_COMMIT="$(git ls-remote https://github.com/dmtrKovalenko/fff.git "refs/tags/v$FFF_VERSION^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$FFF_COMMIT" ]]; then
            FFF_COMMIT="$(git ls-remote https://github.com/dmtrKovalenko/fff.git "refs/tags/v$FFF_VERSION" | awk 'NR == 1 { print $1 }')"
          fi
          [[ "$FFF_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not resolve official FFF source tag v$FFF_VERSION" >&2; exit 1; }
          python3 - "$PACKAGE_JSON" "$VERSION" "$UPSTREAM_SHA" "$UPSTREAM_TAG" "$CURRENT" "$SOURCE_SHA256" tools/supply-chain-lock.json candidate/upstream-source "$FFF_VERSION" "$FFF_COMMIT" <<'PY'
          import json, pathlib, re, sys
          package_raw, version, commit, tag, current, digest, lock_path, source_root, fff_version, fff_commit = sys.argv[1:]
          package = json.loads(package_raw)
          lock_file = pathlib.Path(lock_path)
          lock = json.loads(lock_file.read_text(encoding="utf-8"))
          if version in lock.get("opencode", {}):
              raise SystemExit(f"Version {version} already exists in the source lock; refusing to overwrite it.")
          current_entry = lock["opencode"].get(current)
          if not isinstance(current_entry, dict):
              raise SystemExit(f"Current lock entry {current} is missing.")
          # Carry forward the last known Android toolchain as a candidate only.
          # The PR build must prove compatibility; a maintainer must review upstream
          # dependency changes and device behavior before merging or publishing.
          entry = {k: v for k, v in current_entry.items() if k not in ("commit", "source_sha256", "cli_linux_arm64_sha256")}
          entry["commit"] = commit
          entry["source_sha256"] = digest
          lock["opencode"][version] = entry
          lock["current"] = version
          lock["package_revision"] = 1

          daemon_manifest = pathlib.Path(source_root, "packages/process-daemon/Cargo.toml").read_text(encoding="utf-8")
          daemon_name = re.search(r'^name\s*=\s*"([^"]+)"', daemon_manifest, re.M)
          daemon_version = re.search(r'^version\s*=\s*"([^"]+)"', daemon_manifest, re.M)
          ghostty_commit = pathlib.Path(source_root, "packages/process-daemon/ghostty-revision").read_text(encoding="utf-8").strip()
          if not daemon_name or daemon_name.group(1) != "opencode-pty" or not daemon_version:
              raise SystemExit("Official process-daemon Cargo manifest is missing or changed.")
          if not re.fullmatch(r"[0-9a-f]{40}", ghostty_commit):
              raise SystemExit("Official process-daemon Ghostty revision is not a full commit SHA.")
          daemon_pin = dict(lock.get("process_daemon", {}))
          daemon_pin.update({
              "package": "opencode-pty",
              "version": daemon_version.group(1),
              "source": "anomalyco/opencode/packages/process-daemon",
              "ghostty_commit": ghostty_commit,
              "android_targets": ["aarch64-linux-android", "x86_64-linux-android"],
          })
          lock["process_daemon"] = daemon_pin

          upstream_bun_lock = json.load(open(pathlib.Path(source_root, "bun.lock"), encoding="utf-8"))
          upstream_fff_version = upstream_bun_lock["workspaces"]["packages/core"]["dependencies"]["@ff-labs/fff-bun"]
          if upstream_fff_version != fff_version or not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", fff_version):
              raise SystemExit("Official OpenCode bun.lock FFF dependency differs from its resolved source tag.")
          if not re.fullmatch(r"[0-9a-f]{40}", fff_commit):
              raise SystemExit("Official FFF source tag did not resolve to a full commit SHA.")
          fff_pin = dict(lock.get("fff", {}))
          fff_pin.update({
              "package": "@ff-labs/fff-bun",
              "version": fff_version,
              "source": "dmtrKovalenko/fff",
              "commit": fff_commit,
              "crate": "fff-c",
              "android_targets": ["aarch64-linux-android", "x86_64-linux-android"],
          })
          lock["fff"] = fff_pin
          lock_file.write_text(json.dumps(lock, indent=2, sort_keys=False) + "\n", encoding="utf-8")

          candidate = {
              "schema_version": 1,
              "status": "candidate_only_not_approved_for_release",
              "source_repository": "anomalyco/opencode",
              "upstream_tag": tag,
              "locked_version": current,
              "candidate_version": version,
              "commit": commit,
              "source_sha256": digest,
              "source_archive": f"https://codeload.github.com/anomalyco/opencode/tar.gz/{commit}",
              "package_name": package.get("name"),
              "package_dependencies": package.get("dependencies", {}),
              "package_dev_dependencies": package.get("devDependencies", {}),
              "inherited_android_toolchain": entry,
              "process_daemon": daemon_pin,
              "fff": fff_pin,
              "required_review": [
                  "Require exact upstream source and native dependency pins to pass static and supply-chain checks.",
                  "Require ARM64 and x86_64 CI builds, daemon/FFF/watcher compilation, archive validation and smoke tests to pass.",
                  "No physical Termux device testing is required; automated ARM64 and x86_64 CI validation is the acceptance gate.",
                  "Only the tag-triggered release workflow may publish immutable archives and update release-checksums.json."
              ]
          }
          pathlib.Path("candidate/upstream-update-candidate.json").write_text(
              json.dumps(candidate, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          pathlib.Path("candidate/upstream-update-pr-body.md").write_text(
              "# Automated upstream update candidate\n\n"
              f"- Official source: [{tag}](https://github.com/anomalyco/opencode/tree/{commit})\n"
              f"- Previous locked version: {current}\n"
              f"- Candidate version: {version}\n"
              f"- Source commit: \u0060{commit}\u0060\n"
              f"- Source archive SHA-256: \u0060{digest}\u0060\n\n"
              "## What this PR does\n"
              "- Adds the exact upstream commit and source archive digest to the supply-chain lock.\n"
              "- Advances the candidate lock version so ARM64/x86_64 pull-request CI builds the new source.\n"
              "- Reuses the last known Android toolchain pins only as a starting candidate.\n"
              f"- Updates the official `opencode-pty` crate pin to {daemon_version.group(1)} and Ghostty commit `{ghostty_commit}`.\n"
              f"- Updates FFF to the exact `@ff-labs/fff-bun` version {fff_version} and source commit `{fff_commit}`; Android libraries are rebuilt from source.\n\n"
              "## Manual review and release gate\n"
              "- This PR remains a draft after automated validation, even if all checks pass.\n"
              "- A maintainer must inspect the diff, approve it, mark it ready, and merge it manually.\n"
              "- A maintainer creates the version tag after merging; the tag-triggered workflow then builds and publishes verified release archives.\n"
              "- If any check fails, the PR remains a draft and the six-hour watcher retries validation.\n"
              "- No workflow auto-merges candidates or creates release tags; only the tag-triggered release workflow updates release-checksums.json after both architecture archives pass validation.\n",
              encoding="utf-8"
          )
          PY

          BRANCH="automation/upstream-opencode-$VERSION"
          echo "update_available=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "sha256=$SOURCE_SHA256" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Prepared OpenCode $VERSION candidate from $UPSTREAM_TAG at $UPSTREAM_SHA."

      - name: Open a draft pull request with the candidate lock
        if: steps.candidate.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --json number,headRefName --jq '[.[] | select(.headRefName | startswith("automation/upstream-opencode-"))][0] // empty')"
          if [[ -n "$EXISTING" ]]; then
            EXISTING_BRANCH="$(jq -r '.headRefName' <<<"$EXISTING")"
            EXISTING_NUMBER="$(jq -r '.number' <<<"$EXISTING")"
            echo "Candidate PR #$EXISTING_NUMBER is already open on $EXISTING_BRANCH; dispatching validation again before preparing another candidate."
            gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$EXISTING_BRANCH"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Candidate branch $BRANCH already exists without an open PR; refusing to overwrite it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add tools/supply-chain-lock.json
          git commit -m "build: prepare OpenCode $VERSION upstream candidate"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" \
            --base main \
            --draft \
            --title "Prepare OpenCode $VERSION Android/Termux update" \
            --body-file candidate/upstream-update-pr-body.md
          gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Upload candidate provenance
        if: steps.candidate.outputs.update_available == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: opencode-upstream-candidate-${{ steps.candidate.outputs.version }}
          path: candidate/upstream-update-candidate.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize candidate status
        if: steps.candidate.outputs.update_available == 'true'
        run: |
          {
            echo "## Upstream update candidate prepared"
            echo
            echo "- Version: ${{ steps.candidate.outputs.version }}"
            echo "- Official tag: ${{ steps.candidate.outputs.tag }}"
            echo "- Commit: ${{ steps.candidate.outputs.commit }}"
            echo "- Source SHA-256: ${{ steps.candidate.outputs.sha256 }}"
            echo "- Draft PR branch: ${{ steps.candidate.outputs.branch }}"
            echo
            echo "The workflow checks upstream every six hours and explicitly dispatches validate.yml against the candidate branch because PRs created with GITHUB_TOKEN do not trigger pull_request workflows. No release was published and installer metadata was not changed."
          } >> "$GITHUB_STEP_SUMMARY"
