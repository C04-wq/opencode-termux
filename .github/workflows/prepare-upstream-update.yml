name: Prepare upstream OpenCode update candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-upstream-candidate
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the locked source metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Resolve and verify the upstream source candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail

          CURRENT="$(python3 tools/ocver.py current)"
          UPSTREAM_BRANCH="$(curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --proto '=https' --proto-redir '=https' \
            https://api.github.com/repos/anomalyco/opencode |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["default_branch"])')"

          BRANCH_META="$(curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --proto '=https' --proto-redir '=https' \
            "https://api.github.com/repos/anomalyco/opencode/branches/$UPSTREAM_BRANCH")"
          UPSTREAM_SHA="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])' <<<"$BRANCH_META")"
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]

          # Match the same root package manifest used by the daily upstream checker.
          PACKAGE_JSON="$(curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --proto '=https' --proto-redir '=https' \
            "https://raw.githubusercontent.com/anomalyco/opencode/$UPSTREAM_SHA/package.json")"
          if ! python3 -c 'import json,sys; p=json.load(sys.stdin); assert isinstance(p.get("version"),str)' <<<"$PACKAGE_JSON" 2>/dev/null; then
            PACKAGE_JSON="$(curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --proto '=https' --proto-redir '=https' \
              "https://raw.githubusercontent.com/anomalyco/opencode/$UPSTREAM_SHA/packages/opencode/package.json")"
          fi

          VERSION="$(python3 -c 'import json,re,sys; v=json.load(sys.stdin)["version"]; assert re.fullmatch(r"[0-9]+[.][0-9]+[.][0-9]+",v), f"Unsupported upstream version: {v!r}"; print(v)' <<<"$PACKAGE_JSON")"
          python3 - "$CURRENT" "$VERSION" <<'PY'
          import re, sys
          current, candidate = sys.argv[1:]
          pattern = re.compile(r"[0-9]+[.][0-9]+[.][0-9]+")
          for value in (current, candidate):
              if not pattern.fullmatch(value):
                  raise SystemExit(f"Invalid semantic version: {value!r}")
          if tuple(map(int, candidate.split("."))) <= tuple(map(int, current.split("."))):
              raise SystemExit(f"No newer upstream version: locked={current}, candidate={candidate}")
          PY

          ARCHIVE="$RUNNER_TEMP/opencode-source-$VERSION.tar.gz"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --proto '=https' --proto-redir '=https' \
            "https://codeload.github.com/anomalyco/opencode/tar.gz/$UPSTREAM_SHA" -o "$ARCHIVE"
          SOURCE_SHA256="$(sha256sum "$ARCHIVE" | cut -d ' ' -f1)"
          [[ "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]

          mkdir -p candidate
          python3 - "$PACKAGE_JSON" "$VERSION" "$UPSTREAM_SHA" "$UPSTREAM_BRANCH" "$CURRENT" "$SOURCE_SHA256" <<'PY'
          import json, pathlib, sys
          package, version, commit, branch, current, digest = sys.argv[1:]
          manifest = json.loads(package)
          result = {
              "schema_version": 1,
              "status": "candidate_only_not_approved_for_release",
              "source_repository": "anomalyco/opencode",
              "upstream_default_branch": branch,
              "locked_version": current,
              "candidate_version": version,
              "commit": commit,
              "source_sha256": digest,
              "source_archive": f"https://codeload.github.com/anomalyco/opencode/tar.gz/{commit}",
              "package_name": manifest.get("name"),
              "package_dependencies": manifest.get("dependencies", {}),
              "package_dev_dependencies": manifest.get("devDependencies", {}),
              "required_manual_review": [
                  "Confirm the package manifest path and upstream release/tag provenance.",
                  "Resolve and pin compatible Bun, OpenTUI, bun-pty, Zig and NDK inputs.",
                  "Review upstream changes and update tools/supply-chain-lock.json only with verified immutable inputs.",
                  "Run the full Android/Bionic ARM64 source build and archive validation.",
                  "Run Termux device smoke tests before publishing any release.",
                  "Do not modify release-checksums.json or publish from this candidate artifact."
              ]
          }
          pathlib.Path("candidate/upstream-update-candidate.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\\n",
              encoding="utf-8"
          )
          PY

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "sha256=$SOURCE_SHA256" >> "$GITHUB_OUTPUT"
          echo "Prepared candidate OpenCode $VERSION at $UPSTREAM_SHA (SHA-256 $SOURCE_SHA256)."

      - name: Upload review-only candidate metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: opencode-upstream-candidate-${{ steps.candidate.outputs.version }}
          path: candidate/upstream-update-candidate.json
          if-no-files-found: error
          retention-days: 14

      - name: Summarize the required next steps
        run: |
          {
            echo "## Upstream candidate prepared"
            echo
            echo "- Version: ${{ steps.candidate.outputs.version }}"
            echo "- Commit: `${{ steps.candidate.outputs.commit }}`"
            echo "- Source archive SHA-256: `${{ steps.candidate.outputs.sha256 }}`"
            echo "- Candidate metadata is attached as a workflow artifact."
            echo
            echo "**No lockfile, installer metadata, release, or published binary was changed.**"
            echo "Review dependencies, complete the Android/Bionic ARM64 build, and pass Termux device tests before approving a lockfile update."
          } >> "$GITHUB_STEP_SUMMARY"
