name: Check upstream OpenCode releases

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Compare the latest official OpenCode 2.x tag with our source lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(python3 tools/ocver.py current)"
          TAGS="$(curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --proto '=https' --proto-redir '=https' \
            "https://api.github.com/repos/anomalyco/opencode/git/matching-refs/tags/v2.")"
          read -r LATEST_TAG LATEST LATEST_SHA < <(
            printf '%s' "$TAGS" | python3 -c '
          import json, re, sys
          refs = json.load(sys.stdin)
          candidates = []
          for item in refs:
              match = re.fullmatch(r"refs/tags/(v2[.][0-9]+[.][0-9]+)", item.get("ref", ""))
              if not match:
                  continue
              obj = item.get("object", {})
              sha = obj.get("sha", "")
              if obj.get("type") != "commit" or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  continue
              tag = match.group(1)
              version = tag[1:]
              candidates.append((tuple(map(int, version.split("."))), tag, version, sha))
          if not candidates:
              raise SystemExit("No stable official v2.x.y OpenCode tags were found")
          _, tag, version, sha = max(candidates)
          print(tag, version, sha)
          '
          )
          [[ "$LATEST_TAG" == "v$LATEST" && "$LATEST_SHA" =~ ^[0-9a-f]{40}$ ]]

          UPDATE_AVAILABLE="$(python3 - "$CURRENT" "$LATEST" <<'PY'
          import re, sys
          current, latest = sys.argv[1:]
          pattern = re.compile(r"[0-9]+[.][0-9]+[.][0-9]+")
          if not pattern.fullmatch(current) or not pattern.fullmatch(latest):
              raise SystemExit(f"Invalid version from lock/tag: {current!r}, {latest!r}")
          print("true" if tuple(map(int, latest.split("."))) > tuple(map(int, current.split("."))) else "false")
          PY
          )"

          if [[ "$UPDATE_AVAILABLE" == "true" ]]; then
            TITLE="Update Android/Termux build for OpenCode $LATEST"
            if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE" --json title --jq 'length' | grep -qx 0; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$TITLE" \
                --body "The official anomalyco/opencode repository published source tag $LATEST_TAG at commit $LATEST_SHA, while the source lock still pins $CURRENT. Review that exact tag and commit, update the pinned OpenCode commit, Bun/OpenTUI/bun-pty versions and verified hashes, run the Android/Bionic build and device smoke tests, then publish the new Termux runtime. Do not change installer metadata until the new archive passes all build and validation jobs."
            fi
            echo "New official OpenCode 2.x tag detected: $LATEST_TAG ($LATEST_SHA); locked version: $CURRENT."
          else
            echo "OpenCode source lock is current ($CURRENT); latest official v2.x tag is $LATEST_TAG."
          fi
