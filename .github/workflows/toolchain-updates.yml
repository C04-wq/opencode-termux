name: Check toolchain updates
on:
  push:
    branches:
      - main
      - codex/maintenance-and-updates
    paths:
      - ".github/workflows/toolchain-updates.yml"
      - "scripts/build-android-release.sh"
      - "scripts/check-toolchain-updates.mjs"
      - "scripts/setup-alpine-chroot.sh"
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: opencode-termux-toolchain-update
  cancel-in-progress: false

jobs:
  check-alpine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pinned full commit SHA (actions/checkout v7.0.1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check runner Node.js and npm
        run: |
          set -euo pipefail
          node --version
          npm --version
      - name: Check official Alpine stable branch
        id: check
        run: |
          set -euo pipefail
          PINNED_BRANCH="$(sed -n 's/^ALPINE_VERSION="\([0-9.]*\)"$/\1/p' scripts/build-android-release.sh)"
          node scripts/check-toolchain-updates.mjs | tee toolchain-update.log
          if grep -q '^ALPINE_UPDATE=true$' toolchain-update.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "current=$(sed -n 's/^ALPINE_CURRENT=//p' toolchain-update.log)" >> "$GITHUB_OUTPUT"
            echo "latest=$(sed -n 's/^ALPINE_LATEST=//p' toolchain-update.log)" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "current=$PINNED_BRANCH" >> "$GITHUB_OUTPUT"
            echo "latest=$PINNED_BRANCH" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare Alpine package verifier without a container action
        run: |
          set -euo pipefail
          bash scripts/setup-alpine-chroot.sh "${{ steps.check.outputs.latest }}" "$RUNNER_TEMP/alpine-root"
          echo "ALPINE_ROOT=$RUNNER_TEMP/alpine-root" >> "$GITHUB_ENV"
      - name: Validate build script
        run: bash -n scripts/build-android-release.sh
      - name: Build and inspect candidate archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu patchelf
          OPENCODE_VERSION="$(gh api repos/anomalyco/opencode/releases/latest --jq '.tag_name' | sed 's/^v//')"
          UPSTREAM_SHA256="$(gh api repos/anomalyco/opencode/releases/latest --jq '.assets[] | select(.name == "opencode-linux-arm64-musl.tar.gz") | .digest' | sed 's/^sha256://')"
          if ! [[ "$UPSTREAM_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Official OpenCode release did not provide a valid SHA-256 digest." >&2
            exit 1
          fi
          bash scripts/build-android-release.sh "$OPENCODE_VERSION" "$RUNNER_TEMP/opencode-termux-aarch64.tar.gz" "$UPSTREAM_SHA256"
          tar -tzf "$RUNNER_TEMP/opencode-termux-aarch64.tar.gz"
      - name: Update Alpine pin automatically after successful validation
        if: steps.check.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-android-release.sh
          if git diff --cached --quiet; then
            echo "No Alpine pin change to commit."
            exit 0
          fi
          git commit -m "build: update Alpine stable branch to ${LATEST}"
          git push origin HEAD:main
