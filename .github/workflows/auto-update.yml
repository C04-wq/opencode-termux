name: Build and publish GitHub release
on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build-android-release.sh"
      - "scripts/setup-alpine-chroot.sh"
      - "release-checksums.json"
      - ".github/workflows/auto-update.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opencode-termux-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Resolve official OpenCode release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(gh api repos/anomalyco/opencode/releases/latest --jq '.tag_name' | sed 's/^v//')"
          if ! [[ "$VERSION" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            echo "Invalid official OpenCode version: $VERSION" >&2
            exit 1
          fi
          UPSTREAM_SHA256="$(gh api repos/anomalyco/opencode/releases/latest --jq '.assets[] | select(.name == "opencode-linux-arm64-musl.tar.gz") | .digest' | sed 's/^sha256://')"
          if ! [[ "$UPSTREAM_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Official ARM64 musl asset has no valid SHA-256 digest." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_sha256=$UPSTREAM_SHA256" >> "$GITHUB_OUTPUT"
      - name: Prepare Alpine package verifier
        run: |
          set -euo pipefail
          BRANCH="$(sed -n 's/^ALPINE_VERSION="\\([0-9.]*\\)"$/\\1/p' scripts/build-android-release.sh)"
          test -n "$BRANCH"
          bash scripts/setup-alpine-chroot.sh "$BRANCH" "$RUNNER_TEMP/alpine-root"
          echo "ALPINE_ROOT=$RUNNER_TEMP/alpine-root" >> "$GITHUB_ENV"
      - name: Build Android-compatible archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_SHA256: ${{ steps.version.outputs.upstream_sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu patchelf
          bash -n scripts/build-android-release.sh
          bash scripts/build-android-release.sh "$VERSION" opencode-termux-aarch64.tar.gz "$UPSTREAM_SHA256"
          tar -tzf opencode-termux-aarch64.tar.gz
          ARCHIVE_SHA256="$(sha256sum opencode-termux-aarch64.tar.gz | awk '{print $1}')"
          node -e 'const fs=require("fs"); fs.writeFileSync("release-checksums.json", JSON.stringify({version: process.argv[1], archiveSha256: process.argv[2]}, null, 2) + "\\n")' "$VERSION" "$ARCHIVE_SHA256"
          echo "ARCHIVE_SHA256=$ARCHIVE_SHA256" >> "$GITHUB_ENV"
      - name: Commit release metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-checksums.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update OpenCode release metadata"
            git push origin "HEAD:main"
          fi
      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/release-check"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern opencode-termux-aarch64.tar.gz --dir "$RUNNER_TEMP/release-check"
            EXPECTED="$(node -p "require('./release-checksums.json').archiveSha256")"
            ACTUAL="$(sha256sum "$RUNNER_TEMP/release-check/opencode-termux-aarch64.tar.gz" | awk '{print $1}')"
            test "$EXPECTED" = "$ACTUAL"
          else
            gh release create "$TAG" opencode-termux-aarch64.tar.gz \\
              --repo "$GITHUB_REPOSITORY" \\
              --title "$TAG" \\
              --notes "OpenCode $TAG packaged for Termux ARM64."
          fi
