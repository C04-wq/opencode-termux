name: Build and publish Termux package

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "install.js"
      - "README.md"
      - "scripts/build-android-release.sh"
      - "scripts/setup-alpine-chroot.sh"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish a new package revision even when the upstream version has not changed"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: opencode-termux-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pinned full commit SHA for supply-chain safety (actions/checkout v5.0.0; Node.js 24).
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a

      - name: Install ARM64 musl build toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu patchelf

      - name: Resolve upstream and publication state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OPENCODE_VERSION="$(gh api repos/anomalyco/opencode/releases/latest --jq '.tag_name' | sed 's/^v//')"
          if ! [[ "$OPENCODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: unexpected official OpenCode version: $OPENCODE_VERSION" >&2
            exit 1
          fi

          UPSTREAM_ARCHIVE_SHA256="$(gh api repos/anomalyco/opencode/releases/latest --jq '.assets[] | select(.name == "opencode-linux-arm64-musl.tar.gz") | .digest' | sed 's/^sha256://')"
          if ! [[ "$UPSTREAM_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Error: the official ARM64 musl asset has no SHA-256 digest." >&2
            exit 1
          fi

          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          CURRENT_UPSTREAM="${CURRENT_VERSION%%-*}"
          FORCE_PUBLISH="false"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force_publish }}" = "true" ]; then
            FORCE_PUBLISH="true"
          fi

          # npm versions are immutable. Use the clean official version for a new
          # upstream base when available; custom publications increment -1, -2...
          # within that same base. This also continues safely from legacy suffixes.
          # Fail closed: a registry/network/auth error must never look like an empty registry.
          if ! PUBLISHED_VERSIONS="$(npm view opencode-termux versions --json)"; then
            echo "Error: could not query published npm versions; refusing to guess publication state." >&2
            exit 1
          fi
          PACKAGE_VERSION="$(node - "$OPENCODE_VERSION" "$CURRENT_VERSION" "$FORCE_PUBLISH" "$PUBLISHED_VERSIONS" <<'NODE'
          const [upstream, current, force, raw] = process.argv.slice(2);
          let versions;
          try {
            versions = JSON.parse(raw);
          } catch {
            throw new Error("Could not parse published npm versions.");
          }
          if (!Array.isArray(versions)) versions = [versions];
          const published = new Set(versions.filter(v => typeof v === "string"));
          const nextRevision = base => {
            const escaped = base.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const pattern = new RegExp("^" + escaped + "-(\\d+)$");
            let max = 0;
            for (const version of published) {
              const match = version.match(pattern);
              if (match) max = Math.max(max, Number(match[1]));
            }
            return `${base}-${max + 1}`;
          };
          let candidate;
          if (force === "true" && upstream === current.split("-")[0]) {
            candidate = published.has(upstream) || [...published].some(v => v.startsWith(upstream + "-"))
              ? nextRevision(upstream)
              : upstream;
          } else if (upstream === current.split("-")[0]) {
            candidate = current;
          } else {
            candidate = published.has(upstream) ? nextRevision(upstream) : upstream;
          }
          process.stdout.write(candidate);
          NODE
          )"

          if npm view "opencode-termux@${PACKAGE_VERSION}" version >/dev/null 2>"$RUNNER_TEMP/npm-version-check.err"; then
            NPM_EXISTS=true
          elif grep -q 'E404' "$RUNNER_TEMP/npm-version-check.err"; then
            NPM_EXISTS=false
          else
            cat "$RUNNER_TEMP/npm-version-check.err" >&2
            echo "Error: npm version lookup failed for ${PACKAGE_VERSION}; refusing to publish." >&2
            exit 1
          fi

          if gh release view "v${PACKAGE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>"$RUNNER_TEMP/gh-release-check.err"; then
            RELEASE_EXISTS=true
          elif grep -qiE 'release not found|HTTP 404|Not Found' "$RUNNER_TEMP/gh-release-check.err"; then
            RELEASE_EXISTS=false
          else
            cat "$RUNNER_TEMP/gh-release-check.err" >&2
            echo "Error: GitHub Release lookup failed for v${PACKAGE_VERSION}; refusing to publish." >&2
            exit 1
          fi
          if [ "$NPM_EXISTS" != "$RELEASE_EXISTS" ]; then
            echo "Error: npm and GitHub Release state disagree for v${PACKAGE_VERSION}." >&2
            echo "Refusing to rebuild or publish a potentially mismatched archive. Recover the missing side manually." >&2
            exit 1
          fi

          echo "opencode_version=$OPENCODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_archive_sha256=$UPSTREAM_ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "force_publish=$FORCE_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "npm_exists=$NPM_EXISTS" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Read pinned Alpine branch
        if: steps.state.outputs.npm_exists == 'false' || steps.state.outputs.release_exists == 'false'
        id: alpine-pin
        run: |
          set -euo pipefail
          echo "branch=v$(sed -n 's/^ALPINE_VERSION=\"\([0-9.]*\)\"$/\1/p' scripts/build-android-release.sh)" >> "$GITHUB_OUTPUT"

      - name: Prepare Alpine package verifier without a container action
        if: steps.state.outputs.npm_exists == 'false' || steps.state.outputs.release_exists == 'false'
        env:
          BRANCH: ${{ steps.alpine-pin.outputs.branch }}
        run: |
          set -euo pipefail
          bash scripts/setup-alpine-chroot.sh "${BRANCH#v}" "$RUNNER_TEMP/alpine-root"
          echo "ALPINE_ROOT=$RUNNER_TEMP/alpine-root" >> "$GITHUB_ENV"

      - name: Build Android-compatible release archive
        if: steps.state.outputs.npm_exists == 'false' || steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          node --check install.js
          bash -n bin/opencode
          bash -n scripts/build-android-release.sh
          npm version "${{ steps.state.outputs.package_version }}" --no-git-tag-version --allow-same-version
          bash scripts/build-android-release.sh "${{ steps.state.outputs.opencode_version }}" opencode-termux-aarch64.tar.gz "${{ steps.state.outputs.upstream_archive_sha256 }}"
          ARCHIVE_SHA256="$(sha256sum opencode-termux-aarch64.tar.gz | awk '{print $1}')"
          node -e 'const fs=require("fs"); fs.writeFileSync("release-checksums.json", JSON.stringify({version: process.argv[1], archiveSha256: process.argv[2]}, null, 2) + "\n")' "${{ steps.state.outputs.package_version }}" "$ARCHIVE_SHA256"
          sha256sum opencode-termux-aarch64.tar.gz
          tar -tzf opencode-termux-aarch64.tar.gz
          npm pack --dry-run

      - name: Publish npm package
        if: steps.state.outputs.npm_exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NPM_CONFIG_USERCONFIG="$(mktemp)"
          export NPM_CONFIG_USERCONFIG
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --tag latest

      - name: Create GitHub release
        if: steps.state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${{ steps.state.outputs.package_version }}" opencode-termux-aarch64.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${{ steps.state.outputs.package_version }}" \
            --notes "OpenCode v${{ steps.state.outputs.opencode_version }} packaged for Termux ARM64."

      - name: Commit generated checksum metadata
        if: steps.state.outputs.npm_exists == 'false' || steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json release-checksums.json
          git diff --cached --quiet || git commit -m "chore: publish v${{ steps.state.outputs.package_version }}"
          git push
