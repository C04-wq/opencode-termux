name: Auto Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Create release for current version"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest opencode version
        id: opencode
        run: |
          OPENCODE_VERSION=$(curl -s https://api.github.com/repos/anomalyco/opencode/releases/latest | grep "\"tag_name\"" | cut -d"\"" -f4 | sed "s/v//")
          if [ -z "$OPENCODE_VERSION" ]; then echo "Error: could not get opencode version"; exit 1; fi
          PACKAGE_VERSION="${OPENCODE_VERSION}-0"
          echo "opencode_version=$OPENCODE_VERSION" >> $GITHUB_OUTPUT
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Get current package version
        id: current
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: release_check
        run: |
          VERSION=${{ steps.current.outputs.version }}
          if gh release view "v$VERSION" --repo C04-wq/opencode-termux > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if npm version exists
        id: npm_check
        run: |
          PACKAGE_VERSION=${{ steps.opencode.outputs.package_version }}
          if npm view "opencode-termux@$PACKAGE_VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update and publish
        if: (steps.opencode.outputs.package_version != steps.current.outputs.version && steps.npm_check.outputs.exists == 'false') || (inputs.force_release == true && steps.release_check.outputs.exists == 'false')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          OPENCODE_VERSION=${{ steps.opencode.outputs.opencode_version }}
          PACKAGE_VERSION=${{ steps.opencode.outputs.package_version }}
          echo "Updating to v$PACKAGE_VERSION (opencode v$OPENCODE_VERSION)"

          npm config set //registry.npmjs.org/:_authToken $NODE_AUTH_TOKEN

          npm version $PACKAGE_VERSION --no-git-tag-version --force

          PREV_RELEASE=$(gh release list --repo C04-wq/opencode-termux --limit 1 --json tagName -q ".[0].tagName")
          if [ -n "$PREV_RELEASE" ]; then
            gh release download "$PREV_RELEASE" --repo C04-wq/opencode-termux -p opencode-termux-aarch64.tar.gz -D /tmp --clobber
            cd /tmp && tar -xzf opencode-termux-aarch64.tar.gz
          else
            echo "No previous release, creating from scratch"
            mkdir -p /tmp/ld-musl
          fi

          mkdir -p /tmp/new-opencode
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-arm64-musl.tar.gz" -o /tmp/new-opencode.tar.gz
          cd /tmp/new-opencode && tar -xzf /tmp/new-opencode.tar.gz && chmod +x opencode

          cd $GITHUB_WORKSPACE
          cp /tmp/new-opencode/opencode ./
          cp /tmp/ld-musl-aarch64.so.1 /tmp/libc.musl-aarch64.so.1 /tmp/libgcc_s.so.1 /tmp/libstdc++.so.6 /tmp/libstdc++.so.6.0.33 ./

          echo "Verifying binary..."
          file opencode | grep -q "ARM aarch64" || { echo "Error: wrong architecture"; exit 1; }
          for lib in ld-musl-aarch64.so.1 libc.musl-aarch64.so.1 libgcc_s.so.1 libstdc++.so.6 libstdc++.so.6.0.33; do
            [ -f "$lib" ] || { echo "Error: missing $lib"; exit 1; }
          done
          echo "Binary verified: $(file opencode)"

          tar -czf opencode-termux-aarch64.tar.gz opencode ld-musl-aarch64.so.1 libc.musl-aarch64.so.1 libgcc_s.so.1 libstdc++.so.6 libstdc++.so.6.0.33
          rm -f opencode ld-musl-aarch64.so.1 libc.musl-aarch64.so.1 libgcc_s.so.1 libstdc++.so.6 libstdc++.so.6.0.33

          npm publish --tag latest

          gh release create "v$PACKAGE_VERSION" opencode-termux-aarch64.tar.gz --repo C04-wq/opencode-termux --title "v$PACKAGE_VERSION" --notes "Auto-update to opencode v$OPENCODE_VERSION" --latest || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v$PACKAGE_VERSION" || true
          git push
