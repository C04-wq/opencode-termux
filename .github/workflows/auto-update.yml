name: Auto Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest opencode version
        id: opencode
        run: |
          VERSION=$(curl -s https://api.github.com/repos/anomalyco/opencode/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | sed 's/v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get current package version
        id: current
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update and publish
        if: steps.opencode.outputs.version != steps.current.outputs.version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=${{ steps.opencode.outputs.version }}
          echo "Updating to v$VERSION"

          npm config set //registry.npmjs.org/:_authToken $NODE_AUTH_TOKEN

          npm version $VERSION --no-git-tag-version --force

          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${VERSION}/opencode-linux-arm64-musl.tar.gz" -o /tmp/opencode-new.tar.gz
          cd /tmp && tar -xzf opencode-new.tar.gz && chmod +x opencode

          PREV_RELEASE=$(gh release list --repo C04-wq/opencode-termux --limit 1 --json tagName -q '.[0].tagName')
          gh release download "$PREV_RELEASE" --repo C04-wq/opencode-termux -p opencode-termux-aarch64.tar.gz -D /tmp --clobber
          cd /tmp && tar -xzf opencode-termux-aarch64.tar.gz
          rm -f opencode-termux-aarch64.tar.gz opencode-new.tar.gz

          cp /tmp/opencode $GITHUB_WORKSPACE/opencode
          cd $GITHUB_WORKSPACE
          tar -czf opencode-termux-aarch64.tar.gz opencode ld-musl-aarch64.so.1 libc.musl-aarch64.so.1 libgcc_s.so.1 libstdc++.so.6 libstdc++.so.6.0.33
          rm -f opencode

          npm publish --tag latest

          gh release create "v$VERSION" opencode-termux-aarch64.tar.gz --repo C04-wq/opencode-termux --title "v$VERSION" --notes "Auto-update to opencode v$VERSION" --latest || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v$VERSION" || true
          git push
