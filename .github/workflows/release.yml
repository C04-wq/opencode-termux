name: Build and publish GitHub release
on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/resolve-opencode-release.mjs"
      - "scripts/build-android-release.sh"
      - "scripts/setup-alpine-chroot.sh"
      - "scripts/validate-runtime-archive.sh"
      - "scripts/smoke-test-runtime-archive.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-termux-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Resolve newest stable OpenCode release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/resolve-opencode-release.mjs > "$RUNNER_TEMP/upstream-release.json"
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$RUNNER_TEMP/upstream-release.json")"
          UPSTREAM_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).sha256' "$RUNNER_TEMP/upstream-release.json")"

          RELEASE_RESPONSE="$RUNNER_TEMP/existing-release.json"
          HTTP_CODE="$(curl --silent --show-error \
            --output "$RELEASE_RESPONSE" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")"

          EXISTS=false
          SKIP_BUILD=false
          case "$HTTP_CODE" in
            200)
              EXISTS=true
              if node - "$RELEASE_RESPONSE" release-checksums.json "$VERSION" <<'NODE'
          const fs = require("fs");
          const [releasePath, metadataPath, version] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(releasePath, "utf8"));
          const metadata = JSON.parse(fs.readFileSync(metadataPath, "utf8"));
          const archive = (release.assets || []).find((asset) => asset.name === "opencode-termux-aarch64.tar.gz");
          const checksum = (release.assets || []).find((asset) => asset.name === "opencode-termux-aarch64.tar.gz.sha256");
          const valid = release.tag_name === "v" + version
            && metadata.version === version
            && /^[a-f0-9]{64}$/.test(metadata.archiveSha256 || "")
            && archive?.digest === "sha256:" + metadata.archiveSha256
            && Boolean(checksum);
          process.exit(valid ? 0 : 1);
          NODE
              then
                CHECKSUM_URL="$(node -p 'const r=JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); (r.assets || []).find((asset) => asset.name === "opencode-termux-aarch64.tar.gz.sha256")?.browser_download_url || ""' "$RELEASE_RESPONSE")"
                EXPECTED_ARCHIVE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).archiveSha256' release-checksums.json)"
                if [[ -n "$CHECKSUM_URL" ]] && curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "$CHECKSUM_URL" -o "$RUNNER_TEMP/release-checksum.txt" && grep -Fxq "$EXPECTED_ARCHIVE_SHA256  opencode-termux-aarch64.tar.gz" "$RUNNER_TEMP/release-checksum.txt"; then
                  SKIP_BUILD=true
                fi
              fi
              ;;
            404) ;;
            *)
              echo "GitHub API returned HTTP $HTTP_CODE while checking release v$VERSION." >&2
              cat "$RELEASE_RESPONSE" >&2
              exit 1
              ;;
          esac

          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "skip_build=$SKIP_BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_sha256=$UPSTREAM_SHA256" >> "$GITHUB_OUTPUT"
          echo "Resolved OpenCode v$VERSION (release exists: $EXISTS; skip build: $SKIP_BUILD)"

      - name: Prepare verified Alpine package environment
        if: steps.version.outputs.skip_build != 'true'
        run: |
          set -euo pipefail
          BRANCH="$(awk -F'"' '/^ALPINE_VERSION=/{print $2; exit}' scripts/build-android-release.sh)"
          test -n "$BRANCH"
          bash scripts/setup-alpine-chroot.sh "$BRANCH" "$RUNNER_TEMP/alpine-root"
          echo "ALPINE_ROOT=$RUNNER_TEMP/alpine-root" >> "$GITHUB_ENV"

      - name: Build, validate, and smoke-test ARM64 archive
        if: steps.version.outputs.skip_build != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_SHA256: ${{ steps.version.outputs.upstream_sha256 }}
        run: |
          set -euo pipefail
          retry_apt() {
            local attempt=1 delay=10
            while ! "$@"; do
              if [[ "$attempt" -ge 4 ]]; then
                echo "APT failed after $attempt attempts: $*" >&2
                return 1
              fi
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          retry_apt sudo apt-get -o Acquire::Retries=3 update
          retry_apt sudo apt-get -o Acquire::Retries=3 install --yes gcc-aarch64-linux-gnu patchelf qemu-user
          OUTPUT="$RUNNER_TEMP/opencode-termux-aarch64.tar.gz"
          bash -n scripts/build-android-release.sh
          bash scripts/build-android-release.sh "$VERSION" "$OUTPUT" "$UPSTREAM_SHA256"
          bash scripts/smoke-test-runtime-archive.sh "$OUTPUT" "$VERSION" "$RUNNER_TEMP/runtime-smoke"

      - name: Create GitHub release
        if: steps.version.outputs.skip_build != 'true' && steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum "$RUNNER_TEMP/opencode-termux-aarch64.tar.gz" > "$RUNNER_TEMP/opencode-termux-aarch64.tar.gz.sha256"
          gh release create "v$VERSION" "$RUNNER_TEMP/opencode-termux-aarch64.tar.gz" "$RUNNER_TEMP/opencode-termux-aarch64.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --notes "OpenCode v$VERSION packaged for Termux ARM64. The accompanying SHA-256 file verifies the archive."

      - name: Replace assets in existing GitHub release
        if: steps.version.outputs.skip_build != 'true' && steps.version.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum "$RUNNER_TEMP/opencode-termux-aarch64.tar.gz" > "$RUNNER_TEMP/opencode-termux-aarch64.tar.gz.sha256"
          gh release upload "v$VERSION" "$RUNNER_TEMP/opencode-termux-aarch64.tar.gz" "$RUNNER_TEMP/opencode-termux-aarch64.tar.gz.sha256" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Update release checksum metadata
        if: steps.version.outputs.skip_build != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE_SHA256="$(sha256sum "$RUNNER_TEMP/opencode-termux-aarch64.tar.gz" | awk '{print $1}')"
          node -e 'const fs=require("fs"); fs.writeFileSync("release-checksums.json", JSON.stringify({version: process.argv[1], archiveSha256: process.argv[2]}, null, 2) + "\n")' "$VERSION" "$ARCHIVE_SHA256"

      - name: Commit release metadata
        if: steps.version.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONTENT="$(base64 --wrap=0 release-checksums.json)"
          FILE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/release-checksums.json" --jq '.sha')"
          test -n "$FILE_SHA"
          COMMIT_SHA="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/release-checksums.json" \
            -f message="chore: update OpenCode release metadata" \
            -f content="$CONTENT" \
            -f sha="$FILE_SHA" \
            -f branch=main \
            --jq '.commit.sha')"
          test -n "$COMMIT_SHA"
          echo "Updated release-checksums.json in commit $COMMIT_SHA"
