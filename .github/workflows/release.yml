name: Build and publish GitHub release
on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build-android-release.sh"
      - "scripts/setup-alpine-chroot.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opencode-termux-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve official OpenCode release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$RUNNER_TEMP/upstream-release.json"
          gh api repos/anomalyco/opencode/releases/latest > "$RELEASE_JSON"

          VERSION="$(jq -r '.tag_name // empty' "$RELEASE_JSON" | sed 's/^v//')"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid official OpenCode version: $VERSION" >&2
            exit 1
          fi

          UPSTREAM_SHA256="$(jq -r '.assets[]? | select(.name == "opencode-linux-arm64-musl.tar.gz") | .digest // empty' "$RELEASE_JSON" | sed 's/^sha256://')"
          if ! [[ "$UPSTREAM_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Official ARM64 musl asset has no valid SHA-256 digest." >&2
            exit 1
          fi

          RELEASE_RESPONSE="$RUNNER_TEMP/existing-release.json"
          HTTP_CODE="$(curl --silent --show-error \
            --output "$RELEASE_RESPONSE" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")"

          case "$HTTP_CODE" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "GitHub API returned HTTP $HTTP_CODE while checking release v$VERSION." >&2
              cat "$RELEASE_RESPONSE" >&2
              exit 1
              ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_sha256=$UPSTREAM_SHA256" >> "$GITHUB_OUTPUT"

      - name: Prepare Alpine package verifier
        if: steps.version.outputs.exists == 'false'
        run: |
          set -euo pipefail
          BRANCH="$(sed -n 's/^ALPINE_VERSION="\([0-9.]*\)"$/\1/p' scripts/build-android-release.sh)"
          test -n "$BRANCH"
          bash scripts/setup-alpine-chroot.sh "$BRANCH" "$RUNNER_TEMP/alpine-root"
          echo "ALPINE_ROOT=$RUNNER_TEMP/alpine-root" >> "$GITHUB_ENV"

      - name: Build Android-compatible archive
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_SHA256: ${{ steps.version.outputs.upstream_sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu patchelf
          bash -n scripts/build-android-release.sh
          bash scripts/build-android-release.sh "$VERSION" opencode-termux-aarch64.tar.gz "$UPSTREAM_SHA256"
          tar -tzf opencode-termux-aarch64.tar.gz

      - name: Recover archive from existing GitHub release
        if: steps.version.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern opencode-termux-aarch64.tar.gz --dir "$RUNNER_TEMP/release-check"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern opencode-termux-aarch64.tar.gz.sha256 --dir "$RUNNER_TEMP/release-check" || true
          cp "$RUNNER_TEMP/release-check/opencode-termux-aarch64.tar.gz" opencode-termux-aarch64.tar.gz
          if [[ -f "$RUNNER_TEMP/release-check/opencode-termux-aarch64.tar.gz.sha256" ]]; then
            cp "$RUNNER_TEMP/release-check/opencode-termux-aarch64.tar.gz.sha256" opencode-termux-aarch64.tar.gz.sha256
            sha256sum --check opencode-termux-aarch64.tar.gz.sha256
          fi
          tar -tzf opencode-termux-aarch64.tar.gz

      - name: Create GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum opencode-termux-aarch64.tar.gz > opencode-termux-aarch64.tar.gz.sha256
          gh release create "v$VERSION" opencode-termux-aarch64.tar.gz opencode-termux-aarch64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --notes "OpenCode v$VERSION packaged for Termux ARM64. The accompanying SHA-256 file verifies the archive."

      - name: Verify recovered archive against existing metadata
        if: steps.version.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("release-checksums.json", "utf8")).version')"
          if [[ -f opencode-termux-aarch64.tar.gz.sha256 ]]; then
            sha256sum --check opencode-termux-aarch64.tar.gz.sha256
          elif [[ "$CURRENT_VERSION" == "$VERSION" ]]; then
            EXPECTED_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("release-checksums.json", "utf8")).archiveSha256')"
            ACTUAL_SHA256="$(sha256sum opencode-termux-aarch64.tar.gz | awk '{print $1}')"
            if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
              echo "Existing GitHub release asset does not match the checksum already published for v$VERSION." >&2
              exit 1
            fi
          else
            echo "Existing release has no SHA-256 sidecar and cannot be safely recovered from stale metadata." >&2
            exit 1
          fi

      - name: Update release checksum metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE_SHA256="$(sha256sum opencode-termux-aarch64.tar.gz | awk '{print $1}')"
          node -e 'const fs=require("fs"); fs.writeFileSync("release-checksums.json", JSON.stringify({version: process.argv[1], archiveSha256: process.argv[2]}, null, 2) + "\n")' "$VERSION" "$ARCHIVE_SHA256"

      - name: Commit release metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-checksums.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update OpenCode release metadata"
            git push origin "HEAD:main"
          fi
