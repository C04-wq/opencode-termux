name: Validate package
on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v5 is pinned to a full SHA and uses Node.js 24.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check runner Node.js and npm
        run: |
          set -euo pipefail
          node --version
          npm --version
      - name: Validate scripts and metadata
        run: |
          set -euo pipefail
          node --check install.js
          node --check scripts/check-toolchain-updates.mjs
          node --check scripts/alpine-release-branches.mjs
          node --check scripts/test-toolchain-updates.mjs
          node scripts/test-toolchain-updates.mjs
          bash -n bin/opencode
          bash -n scripts/build-android-release.sh
          bash -n scripts/setup-alpine-chroot.sh
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const sums = require('./release-checksums.json');
          if (pkg.version !== sums.version) throw new Error('package.json and release-checksums.json versions differ');
          if (!/^[a-f0-9]{64}$/.test(sums.archiveSha256)) throw new Error('invalid release SHA-256');
          const installer = fs.readFileSync('install.js', 'utf8');
          const launcher = fs.readFileSync('bin/opencode', 'utf8');
          const builder = fs.readFileSync('scripts/build-android-release.sh', 'utf8');
          const releaseWorkflow = fs.readFileSync('.github/workflows/auto-update.yml', 'utf8');
          const toolchainWorkflow = fs.readFileSync('.github/workflows/toolchain-updates.yml', 'utf8');
          const alpineBootstrap = fs.readFileSync('scripts/setup-alpine-chroot.sh', 'utf8');
          const toolchainChecker = fs.readFileSync('scripts/check-toolchain-updates.mjs', 'utf8');
          const publishPaths = releaseWorkflow.split('paths:')[1]?.split('workflow_dispatch:')[0] ?? '';
          if (/README[.]md/.test(publishPaths)) throw new Error('documentation-only changes must not trigger package publication');
          const releaseCreateIndex = releaseWorkflow.indexOf('Create GitHub release before publishing to npm');
          const npmPublishIndex = releaseWorkflow.indexOf('Publish npm package only after its release asset exists');
          const metadataCommitIndex = releaseWorkflow.indexOf('Commit package metadata');
          if (releaseCreateIndex < 0 || npmPublishIndex < 0 || releaseCreateIndex > npmPublishIndex) throw new Error('GitHub release must be created before npm publication');
          if (metadataCommitIndex < 0 || metadataCommitIndex > releaseCreateIndex) throw new Error('package metadata must be committed before external publication for safe retries');
          if (!releaseWorkflow.includes('recover_release') || !releaseWorkflow.includes('gh release download')) throw new Error('publication workflow must support retrying an existing release after npm publish failure');
          if (!releaseWorkflow.includes("if: github.ref == 'refs/heads/main'")) throw new Error('publishing workflow must run only from main');
          if (!releaseWorkflow.includes('const orphanedNpm')) throw new Error('workflow must stop if any published npm version lacks a GitHub release');
          if (!releaseWorkflow.includes('restore the exact archive')) throw new Error('workflow must fail safely when an already-published npm version has no release asset');
          if (!toolchainChecker.includes('findStableBranches') || !toolchainChecker.includes('No Alpine stable release-branch links')) throw new Error('Alpine updater must parse official release links and fail closed if none are found');
          if (!builder.includes('--arch aarch64')) throw new Error('Alpine APK architecture must be pinned to aarch64');
          if (!builder.includes('libstdc++.so.6.runtime')) throw new Error('builder runtime library filename missing');
          if (/\bdocker\b/i.test(builder)) throw new Error('release builder must not depend on Docker');
          for (const workflow of [releaseWorkflow, toolchainWorkflow, fs.readFileSync('.github/workflows/validate.yml', 'utf8')]) {
            if (workflow.includes(['actions/setup', '-node@'].join(''))) throw new Error('workflows must use the preinstalled runner Node.js to honor the repository action allowlist');
          }
          if (!builder.includes('sudo chroot "$ALPINE_ROOT" /sbin/apk')) throw new Error('builder must verify Alpine packages with apk in a chroot');
          if (releaseWorkflow.includes('jirutka/setup-alpine@') || toolchainWorkflow.includes('jirutka/setup-alpine@')) throw new Error('workflows must not use the disallowed external Alpine action');
          if (!releaseWorkflow.includes('scripts/setup-alpine-chroot.sh') || !toolchainWorkflow.includes('scripts/setup-alpine-chroot.sh')) throw new Error('both workflows must use the local Alpine chroot bootstrap');
          if (!toolchainWorkflow.includes('gh pr create') || !toolchainWorkflow.includes("github.ref == 'refs/heads/main'")) throw new Error('validated Alpine updates must be proposed as PRs only from main');
          if (toolchainWorkflow.includes('git push origin HEAD:main')) throw new Error('toolchain updater must never push directly to main');
          if (!alpineBootstrap.includes('sha256sum --check') || !alpineBootstrap.includes('chroot "$ROOT" /sbin/apk')) throw new Error('Alpine bootstrap must verify the rootfs checksum and apk executable');
          if (installer.includes('fs.cpSync(')) throw new Error('installer uses an API newer than its declared Node engine');
          if (!installer.includes('fs.renameSync(activation, OPENCODE_DIR)')) throw new Error('installer must activate the staged runtime by directory rename');
          if (!installer.includes('"libstdc++.so.6.runtime"')) throw new Error('installer runtime library filename mismatch');
          if (!launcher.includes('unset LD_PRELOAD')) throw new Error('launcher must clear inherited LD_PRELOAD before starting the musl runtime');
          if (!launcher.includes('--library-path "$OPENCODE_DIR"')) throw new Error('launcher must use the packaged musl library path');
          if (!launcher.includes('ld-musl-aarch64.so.1')) throw new Error('launcher must invoke the packaged musl loader');
          NODE
          npm pack --dry-run
