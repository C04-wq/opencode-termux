name: Validate Termux installer
on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate scripts and release metadata
        run: |
          set -euo pipefail
          node --check scripts/check-toolchain-updates.mjs
          node --check scripts/alpine-release-branches.mjs
          node --check scripts/test-toolchain-updates.mjs
          node --check scripts/resolve-opencode-release.mjs
          node --check scripts/test-opencode-release-resolver.mjs
          node scripts/test-toolchain-updates.mjs
          node scripts/test-opencode-release-resolver.mjs
          bash -n install.sh
          bash -n uninstall.sh
          bash -n scripts/build-android-release.sh
          bash -n scripts/setup-alpine-chroot.sh
          node <<'NODE'
          const fs = require('fs');
          const sums = JSON.parse(fs.readFileSync('release-checksums.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$/.test(sums.version)) {
            throw new Error('invalid OpenCode release version');
          }
          if (!/^[a-f0-9]{64}$/.test(sums.archiveSha256)) {
            throw new Error('invalid release SHA-256');
          }
          const installer = fs.readFileSync('install.sh', 'utf8');
          const builder = fs.readFileSync('scripts/build-android-release.sh', 'utf8');
          if (!installer.includes('SHA-256 mismatch; refusing to install')) {
            throw new Error('installer must reject an archive with an incorrect checksum');
          }
          if (!installer.includes('installed runtime failed final test')) {
            throw new Error('installer must verify the runtime after activation');
          }
          if (!installer.includes('opencode-termux.git') || !installer.includes('$PREFIX/opt/opencode-termux')) {
            throw new Error('installer must bootstrap a persistent checkout for one-line installation');
          }
          if (!installer.includes('pull --ff-only')) {
            throw new Error('installer bootstrap must update an existing checkout with fast-forward only');
          }
          if (!builder.includes('--arch aarch64')) {
            throw new Error('Alpine APK architecture must be pinned to aarch64');
          }
          if (!builder.includes('libstdc++.so.6.runtime')) {
            throw new Error('builder runtime library filename mismatch');
          }
          if (/\bdocker\b/i.test(builder)) {
            throw new Error('release builder must not depend on Docker');
          }
          NODE

  release-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Resolve newest stable upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/resolve-opencode-release.mjs > "$RUNNER_TEMP/upstream-release.json"
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$RUNNER_TEMP/upstream-release.json")"
          SHA256="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).sha256' "$RUNNER_TEMP/upstream-release.json")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Testing upstream OpenCode v$VERSION"

      - name: Install cross-build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu patchelf qemu-user

      - name: Prepare verified Alpine chroot
        run: |
          set -euo pipefail
          ALPINE_VERSION="$(awk -F'"' '/^ALPINE_VERSION=/{print $2; exit}' scripts/build-android-release.sh)"
          test -n "$ALPINE_VERSION"
          bash scripts/setup-alpine-chroot.sh "$ALPINE_VERSION" "$RUNNER_TEMP/alpine-root"
          echo "ALPINE_ROOT=$RUNNER_TEMP/alpine-root" >> "$GITHUB_ENV"

      - name: Build and inspect ARM64 Termux archive
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM_SHA256: ${{ steps.upstream.outputs.sha256 }}
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/opencode-termux-aarch64.tar.gz"
          bash scripts/build-android-release.sh "$VERSION" "$OUTPUT" "$UPSTREAM_SHA256"

          ACTUAL_FILES="$(tar -tzf "$OUTPUT" | sort)"
          EXPECTED_FILES="$(printf '%s\n' \
            ld-musl-aarch64.so.1 \
            libc.musl-aarch64.so.1 \
            libgcc_s.so.1 \
            libstdc++.so.6 \
            libstdc++.so.6.runtime \
            opencode | sort)"
          if [[ "$ACTUAL_FILES" != "$EXPECTED_FILES" ]]; then
            echo "Unexpected archive contents:" >&2
            printf '%s\n' "$ACTUAL_FILES" >&2
            exit 1
          fi

          tar -xOf "$OUTPUT" opencode > "$RUNNER_TEMP/opencode"
          readelf -h "$RUNNER_TEMP/opencode" | grep -Eq 'Machine:.*AArch64'
          TERMUX_INTERPRETER="/data/data/com.termux/files/usr/lib/opencode-termux/ld-musl-aarch64.so.1"
          readelf -l "$RUNNER_TEMP/opencode" | grep -Fq "$TERMUX_INTERPRETER" || {
            echo "OpenCode ELF is not patched to use the Termux musl interpreter." >&2
            exit 1
          }

          RUNTIME="$RUNNER_TEMP/runtime"
          mkdir -p "$RUNTIME"
          tar -xzf "$OUTPUT" -C "$RUNTIME"

          # Emulate the Termux filesystem path so QEMU can resolve PT_INTERP
          # exactly as Android's kernel will. Run the ELF directly, not through
          # the loader, otherwise /proc/self/exe points at the loader.
          TERMUX_RUNTIME_PATH="/data/data/com.termux/files/usr/lib/opencode-termux"
          SYSROOT="$RUNNER_TEMP/termux-sysroot"
          mkdir -p "$SYSROOT$TERMUX_RUNTIME_PATH"
          cp "$RUNTIME/ld-musl-aarch64.so.1" "$SYSROOT$TERMUX_RUNTIME_PATH/"
          # QEMU's -L prefixes the ELF interpreter path, but it does not
          # chroot absolute paths from LD_LIBRARY_PATH. Point the guest loader
          # at the extracted host-visible runtime directory so bundled libraries
          # are resolvable during emulation.
          VERSION_OUTPUT="$(timeout 60s env -u LD_PRELOAD qemu-aarch64 -L "$SYSROOT" -E LD_LIBRARY_PATH="$RUNTIME" "$RUNTIME/opencode" --version)"
          test "$VERSION_OUTPUT" = "opencode v$VERSION" || {
            echo "Unexpected emulated runtime version: $VERSION_OUTPUT" >&2
            exit 1
          }
          echo "$VERSION_OUTPUT"

          # A running serve process proves the ELF interpreter and its runtime
          # libraries work for a long-lived OpenCode process, not just --version.
          set +e
          timeout 12s env -u LD_PRELOAD qemu-aarch64 -L "$SYSROOT" -E LD_LIBRARY_PATH="$RUNTIME" "$RUNTIME/opencode" serve --hostname 127.0.0.1 --port 4099 > "$RUNNER_TEMP/opencode-serve.log" 2>&1
          SERVE_STATUS=$?
          set -e
          if [[ "$SERVE_STATUS" -ne 124 ]]; then
            echo "OpenCode serve exited before the smoke-test timeout (status $SERVE_STATUS)." >&2
            cat "$RUNNER_TEMP/opencode-serve.log" >&2
            exit 1
          fi
          echo "OpenCode serve remained running under ARM64 emulation."
          sha256sum "$OUTPUT"
          echo "ARM64 archive structure, PT_INTERP, direct execution, version, and serve startup verified."
