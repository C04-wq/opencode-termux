name: Validate Termux installer
on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate scripts and release metadata
        run: |
          set -euo pipefail
          node --check scripts/check-toolchain-updates.mjs
          node --check scripts/alpine-release-branches.mjs
          node --check scripts/test-toolchain-updates.mjs
          node scripts/test-toolchain-updates.mjs
          bash -n install.sh
          bash -n uninstall.sh
          bash -n scripts/build-android-release.sh
          bash -n scripts/setup-alpine-chroot.sh
          node <<'NODE'
          const fs = require('fs');
          const sums = JSON.parse(fs.readFileSync('release-checksums.json', 'utf8'));
          if (!/^\\d+\\.\\d+\\.\\d+([-.][0-9A-Za-z.-]+)?$/.test(sums.version)) {
            throw new Error('invalid OpenCode release version');
          }
          if (!/^[a-f0-9]{64}$/.test(sums.archiveSha256)) {
            throw new Error('invalid release SHA-256');
          }
          const installer = fs.readFileSync('install.sh', 'utf8');
          const builder = fs.readFileSync('scripts/build-android-release.sh', 'utf8');
          if (!installer.includes('SHA-256 mismatch; refusing to install')) {
            throw new Error('installer must reject an archive with an incorrect checksum');
          }
          if (!installer.includes('installed runtime failed final test')) {
            throw new Error('installer must verify the runtime after activation');
          }
          if (!builder.includes('--arch aarch64')) {
            throw new Error('Alpine APK architecture must be pinned to aarch64');
          }
          if (!builder.includes('libstdc++.so.6.runtime')) {
            throw new Error('builder runtime library filename mismatch');
          }
          if (/\\bdocker\\b/i.test(builder)) {
            throw new Error('release builder must not depend on Docker');
          }
          NODE
