name: Validate Termux native runtime
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  repository_dispatch:
    types: [runtime-metadata-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes shellcheck
      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts "Valid YAML: #{path}" }' .github/workflows/*.yml .github/dependabot.yml
      - name: Validate shell scripts and regression tests
        run: |
          set -euo pipefail
          bash -n install.sh uninstall.sh manager.sh opencode-termux
          bash -n scripts/ci/build-opencode-bundle.sh scripts/ci/build-rust-pty-android.sh scripts/ci/build-parcel-watcher-android.sh scripts/test-termux-device.sh
          bash -n scripts/validate-runtime-archive.sh scripts/test-runtime-archive.sh
          bash -n scripts/smoke-test-runtime-archive.sh scripts/test-package-owner.sh
          bash scripts/test-package-owner.sh
          bash scripts/test-runtime-archive.sh
          bash scripts/test-rust-pty-build.sh
          bash manager.sh help >/dev/null
          bash manager.sh version | grep -Fq 'opencode-termux manager'
          bash manager.sh status | grep -Fq 'Status: not installed'
          bash opencode-termux help >/dev/null
          shellcheck -S error install.sh uninstall.sh manager.sh opencode-termux scripts/*.sh
      - name: Validate native runtime contract
        run: |
          set -euo pipefail
          python3 -m py_compile tools/analyze-runtime-size.py tools/test-runtime-size.py tools/ocver.py tools/upstream_tags.py tools/test_upstream_tags.py tools/patch-opencode-source.py tools/patch-opencode-bundle.py tools/patch-opentui-ffi.py tools/patch-opentui-loader.py tools/patch-fff-android.py tools/patch-opentui-android.py tools/remap-binary-prefix.py tools/transplant/swap_tui.py
          python3 -m json.tool tools/supply-chain-lock.json >/dev/null
          python3 tools/test_upstream_tags.py
          python3 tools/test-runtime-size.py
          python3 -m json.tool tools/transplant/config/bun-bind.json >/dev/null
          node --check scripts/test-native-runtime-contract.mjs
          node scripts/test-native-runtime-contract.mjs
          node --check scripts/test-build-pipeline.mjs
          node scripts/test-build-pipeline.mjs

  native-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install ELF inspection tools
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes binutils
      - name: Download and verify pinned Android bundle
        run: |
          set -euo pipefail
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("release-checksums.json", "utf8")).version')"
          HASH="$(node -p 'JSON.parse(require("fs").readFileSync("release-checksums.json", "utf8")).archiveSha256')"
          SOURCE="$(node -p 'JSON.parse(require("fs").readFileSync("release-checksums.json", "utf8")).sourceRepo')"
          SOURCE_TAG="$(node -p 'JSON.parse(require("fs").readFileSync("release-checksums.json", "utf8")).sourceTag')"
          RELEASE_TAG="$(node -p 'JSON.parse(require("fs").readFileSync("release-checksums.json", "utf8")).releaseTag')"
          case "$SOURCE" in C04-wq/opencode-termux|Spectra010s/opencode-termux) ;; *) echo "Unapproved runtime source: $SOURCE" >&2; exit 1 ;; esac
          test "$SOURCE_TAG" = "v$VERSION"
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            RELEASE_REVISION="${RELEASE_TAG#v$VERSION-}"
            [[ "$RELEASE_TAG" == "v$VERSION-"* && "$RELEASE_REVISION" =~ ^[1-9][0-9]*$ ]] || {
              echo "Invalid package release tag: $RELEASE_TAG" >&2
              exit 1
            }
          fi
          ARCHIVE="$RUNNER_TEMP/opencode-native.tar.gz"
          URL="https://github.com/$SOURCE/releases/download/$RELEASE_TAG/opencode-$VERSION-android-aarch64-bundle.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --proto-redir '=https' "$URL" -o "$ARCHIVE"
          echo "$HASH  $ARCHIVE" | sha256sum -c -
          bash scripts/smoke-test-runtime-archive.sh "$ARCHIVE" "$VERSION" "$RUNNER_TEMP/native-smoke"

      - name: Exercise installer, dependency bootstrap and manager in an isolated prefix
        env:
          PREFIX: ${{ runner.temp }}/termux-prefix
          OPENCODE_TEST_ARCHIVE: ${{ runner.temp }}/opencode-native.tar.gz
        run: |
          set -euo pipefail
          export OPENCODE_TEST_VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("release-checksums.json", "utf8")).version')"
          export OPENCODE_TEST_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("release-checksums.json", "utf8")).archiveSha256')"
          export OPENCODE_TEST_REMOTE_SHA256="$OPENCODE_TEST_SHA256"
          mkdir -p "$PREFIX/etc/tls" "$PREFIX/etc" "$RUNNER_TEMP/termux-stubs"
          printf 'test CA bundle\n' > "$PREFIX/etc/tls/cert.pem"
          printf 'nameserver 1.1.1.1\n' > "$PREFIX/etc/resolv.conf"
          sudo mkdir -p /data/data/com.termux/files/usr/bin
          sudo ln -sf /bin/sh /data/data/com.termux/files/usr/bin/sh
          cat > "$RUNNER_TEMP/termux-stubs/uname" <<'STUB'
          #!/usr/bin/env bash
          echo aarch64
          STUB
          cat > "$RUNNER_TEMP/termux-stubs/curl" <<'STUB'
          #!/usr/bin/env bash
          set -e
          while (($#)); do
            if [[ "$1" == "-o" ]]; then
              cp "$OPENCODE_TEST_ARCHIVE" "$2"
              exit 0
            fi
            shift
          done
          printf '{"version":"%s","runtimeId":"%s","archiveSha256":"%s"}\n' \
            "${OPENCODE_TEST_REMOTE_VERSION:-$OPENCODE_TEST_VERSION}" \
            "${OPENCODE_TEST_REMOTE_RUNTIME_ID:-android-bionic-bun-v1}" \
            "${OPENCODE_TEST_REMOTE_SHA256:-$OPENCODE_TEST_SHA256}"
          STUB
          cat > "$RUNNER_TEMP/termux-stubs/pkg" <<'STUB'
          #!/usr/bin/env bash
          set -e
          mkdir -p "$PREFIX/bin" "$PREFIX/lib"
          cat > "$PREFIX/bin/bun" <<'BUN'
          #!/usr/bin/env bash
          if [[ "${*: -1}" == "--version" ]]; then
            echo "opencode v$OPENCODE_TEST_VERSION"
          fi
          BUN
          cat > "$PREFIX/bin/rg" <<'RG'
          #!/usr/bin/env bash
          exit 0
          RG
          printf 'libc++ test stub\n' > "$PREFIX/lib/libc++_shared.so"
          chmod 755 "$PREFIX/bin/bun" "$PREFIX/bin/rg"
          STUB
          chmod 755 "$RUNNER_TEMP/termux-stubs/"*
          export PATH="$RUNNER_TEMP/termux-stubs:$PREFIX/bin:$PATH"
          bash install.sh
          test -x "$PREFIX/bin/opencode"
          test -x "$PREFIX/bin/opencode-termux"
          test -x "$PREFIX/bin/opencode-termux-update"
          test -s "$PREFIX/lib/opencode-termux/lib/opencode/index.js"
          test -f "$PREFIX/lib/opencode-termux/lib/opencode/bunfig.toml"
          test -s "$PREFIX/lib/opencode-termux/THIRD_PARTY_NOTICES.md"
          test "$(cat "$PREFIX/lib/opencode-termux/.opencode-termux-runtime-id")" = "android-bionic-bun-v1"
          test "$(cat "$PREFIX/lib/opencode-termux/.opencode-termux-archive-sha256")" = "$OPENCODE_TEST_SHA256"
          bash "$PREFIX/bin/opencode" --version | grep -Fxq "opencode v$OPENCODE_TEST_VERSION"
          bash "$PREFIX/bin/opencode-termux" doctor
          # Existing 2.3.2 musl installs must be offered the Bionic migration
          # even though the OpenCode version number itself does not change.
          printf 'legacy-musl\n' > "$PREFIX/lib/opencode-termux/.opencode-termux-runtime-id"
          rm -f "$PREFIX/lib/opencode-termux/.opencode-termux-deferred-version" "$PREFIX/lib/opencode-termux/.opencode-termux-deferred-runtime-id" "$PREFIX/lib/opencode-termux/.opencode-termux-deferred-archive-sha256"
          printf '\033[B\r' | script -qec 'bash "$PREFIX/bin/opencode" --version' /dev/null > "$RUNNER_TEMP/migration-prompt.txt"
          grep -Fq 'A new Termux runtime is available for OpenCode 2.3.2.' "$RUNNER_TEMP/migration-prompt.txt"
          grep -Fxq '2.3.2' "$PREFIX/lib/opencode-termux/.opencode-termux-deferred-version"
          grep -Fxq 'android-bionic-bun-v1' "$PREFIX/lib/opencode-termux/.opencode-termux-deferred-runtime-id"
          grep -Fxq "$OPENCODE_TEST_SHA256" "$PREFIX/lib/opencode-termux/.opencode-termux-deferred-archive-sha256"
          script -qec 'bash "$PREFIX/bin/opencode" --version' /dev/null > "$RUNNER_TEMP/deferred-prompt.txt"
          if grep -Fq 'A new Termux runtime is available' "$RUNNER_TEMP/deferred-prompt.txt"; then
            echo "Deferred runtime prompt was shown again for the same target." >&2
            exit 1
          fi
          # A same-version rebuild with the same runtime ID must prompt when its archive hash changes.
          OPENCODE_TEST_REMOTE_SHA256="$(printf 'a%.0s' {1..64})"
          export OPENCODE_TEST_REMOTE_SHA256
          printf '\033[B\r' | script -qec 'bash "$PREFIX/bin/opencode" --version' /dev/null > "$RUNNER_TEMP/rebuilt-runtime-prompt.txt"
          grep -Fq 'A new Termux runtime is available for OpenCode 2.3.2.' "$RUNNER_TEMP/rebuilt-runtime-prompt.txt"
          grep -Fxq "$OPENCODE_TEST_REMOTE_SHA256" "$PREFIX/lib/opencode-termux/.opencode-termux-deferred-archive-sha256"
          OPENCODE_TEST_REMOTE_VERSION=2.3.3
          export OPENCODE_TEST_REMOTE_VERSION
          printf '\033[B\r' | script -qec 'bash "$PREFIX/bin/opencode" --version' /dev/null > "$RUNNER_TEMP/next-version-prompt.txt"
          grep -Fq 'A new OpenCode version is available: 2.3.3' "$RUNNER_TEMP/next-version-prompt.txt"
          echo "PASS: installer, dependency bootstrap, manager doctor, migration/defer prompts and same-version archive rebuild detection."

  build-x86_64-native:
    name: Build and verify Android x86_64 OpenTUI
    needs: [static-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_API: "28"
    steps:
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes binutils build-essential clang file git llvm patch python3 curl xz-utils

      - name: Resolve pinned source and toolchain
        run: |
          set -euo pipefail
          mapfile -t locked < <(python3 - <<'PY'
          import json
          lock = json.load(open("tools/supply-chain-lock.json", encoding="utf-8"))
          version = lock["current"]
          opentui_version = lock["opencode"][version]["opentui_version"]
          opentui = lock["opentui"][opentui_version]
          print(opentui_version)
          print(opentui["commit"])
          print(opentui["zig_version"])
          print(opentui["zig_x86_64_linux_sha256"])
          print(lock["android_ndk_version"])
          PY
          )
          test "${#locked[@]}" -eq 5
          OPENTUI_VERSION="${locked[0]}"
          OPENTUI_COMMIT="${locked[1]}"
          ZIG_VERSION="${locked[2]}"
          ZIG_SHA256="${locked[3]}"
          NDK_VERSION="${locked[4]}"
          {
            echo "OPENTUI_VERSION=$OPENTUI_VERSION"
            echo "OPENTUI_COMMIT=$OPENTUI_COMMIT"
            echo "ZIG_VERSION=$ZIG_VERSION"
            echo "NDK_VERSION=$NDK_VERSION"
          } >> "$GITHUB_ENV"
          mkdir -p work
          curl --fail --location --retry 3 --retry-all-errors \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            -o work/zig.tar.xz
          echo "$ZIG_SHA256  work/zig.tar.xz" | sha256sum -c -
          tar -xJf work/zig.tar.xz -C work
          ZIG_ROOT="$GITHUB_WORKSPACE/work/zig-x86_64-linux-$ZIG_VERSION"
          echo "$ZIG_ROOT" >> "$GITHUB_PATH"
          export PATH="$ZIG_ROOT:$PATH"
          NDK="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          test -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          ACTUAL_NDK_VERSION="$(sed -n 's/^Pkg.Revision = //p' "$NDK/source.properties" | tr -d '\r')"
          test "$ACTUAL_NDK_VERSION" = "$NDK_VERSION"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "LLVM_STRIP=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> "$GITHUB_ENV"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test "$(zig version)" = "$ZIG_VERSION"

      - name: Fetch pinned OpenTUI source
        run: |
          set -euo pipefail
          mkdir -p work/opentui-x86_64
          git -C work/opentui-x86_64 init .
          git -C work/opentui-x86_64 remote add origin https://github.com/anomalyco/opentui.git
          git -C work/opentui-x86_64 fetch --depth=1 origin "$OPENTUI_COMMIT"
          git -C work/opentui-x86_64 checkout --detach FETCH_HEAD
          test "$(git -C work/opentui-x86_64 rev-parse HEAD)" = "$OPENTUI_COMMIT"

      - name: Apply x86_64 Bionic compatibility patches
        run: |
          set -euo pipefail
          python3 tools/patch-opentui-android.py --target-arch x86_64 work/opentui-x86_64
          git -C work/opentui-x86_64 diff --check
          test ! -e work/opentui-x86_64/packages/native/src/tlsdesc-shim.c
          ! grep -Fq 'tlsdesc-shim.c' work/opentui-x86_64/packages/native/build.zig

      - name: Build x86_64 Bionic OpenTUI library
        run: |
          set -euo pipefail
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIBDIR="$SYSROOT/usr/lib/x86_64-linux-android/$ANDROID_API"
          test -d "$LIBDIR"
          {
            echo "include_dir=$SYSROOT/usr/include/x86_64-linux-android"
            echo "sys_include_dir=$SYSROOT/usr/include"
            echo "crt_dir=$LIBDIR"
            echo "msvc_lib_dir="
            echo "kernel32_lib_dir="
            echo "gcc_dir=$LIBDIR"
            echo "darwin_sdk_dir="
          } > work/android-x86_64-libc.txt
          sh work/opentui-x86_64/packages/native/scripts/prepare-zig-deps.sh
          (
            cd work/opentui-x86_64/packages/native
            OPENTUI_C_REMAP="-ffile-prefix-map=$GITHUB_WORKSPACE=/usr/src -D__ANDROID_MIN_SDK_VERSION__=28 -D__ANDROID_API__=28" \
            BIONIC_ARCH_INCLUDE="$SYSROOT/usr/include/x86_64-linux-android" \
            BIONIC_SYS_INCLUDE="$SYSROOT/usr/include" \
            BIONIC_LIB_DIR="$LIBDIR" \
              zig build -Dlibrary-target=x86_64-linux-android.28 \
                -Doptimize=ReleaseSafe --libc "$GITHUB_WORKSPACE/work/android-x86_64-libc.txt"
          )
          SO=work/opentui-x86_64/packages/native/lib/x86_64-linux-android.28/libopentui.so
          test -s "$SO"
          python3 tools/remap-binary-prefix.py "$SO" "$GITHUB_WORKSPACE" /usr/src
          mkdir -p artifacts/transplant/opentui-bionic-x86_64
          cp "$SO" artifacts/transplant/opentui-bionic-x86_64/libopentui.so

      - name: Verify x86_64 Bionic OpenTUI
        run: |
          set -euo pipefail
          SO=artifacts/transplant/opentui-bionic-x86_64/libopentui.so
          file "$SO" | grep -q 'x86-64'
          readelf -h "$SO" | grep -q 'Type:.*DYN'
          readelf -d "$SO" | grep -q 'NEEDED.*libc.so'
          if readelf -d "$SO" | grep -q 'libc.so.6'; then
            echo "glibc dependency found in x86_64 OpenTUI" >&2
            exit 1
          fi
          # Bionic currently implements TLSDESC only for AArch64. x86_64 must
          # use the traditional TLS ABI and must not ship TLSDESC relocations.
          if readelf -rW "$SO" | grep -q 'TLSDESC'; then
            echo "x86_64 OpenTUI unexpectedly contains unsupported Bionic TLSDESC relocations" >&2
            exit 1
          fi
          if readelf -Ws "$SO" | grep -E 'UND[[:space:]]+pthread_tryjoin_np' >/dev/null; then
            echo "glibc-only pthread_tryjoin_np import found in x86_64 OpenTUI" >&2
            exit 1
          fi
          if grep -aFq "$GITHUB_WORKSPACE" "$SO"; then
            echo "build workspace path leaked into x86_64 OpenTUI" >&2
            exit 1
          fi
          echo "PASS: x86_64 OpenTUI ELF and Bionic TLS contract."

  build-native:
    name: Build and verify Android ARM64 runtime
    needs: [static-checks, native-runtime]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_API: "28"
    steps:
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes \
            binutils build-essential clang file git libnode-dev libssl-dev llvm patch python3 \
            unzip zip curl xz-utils
          command -v cargo
          command -v rustup

      - name: Resolve locked source versions
        run: |
          set -euo pipefail
          VERSION="$(python3 tools/ocver.py current)"
          python3 - "$VERSION" <<'PY' >> "$GITHUB_ENV"
          import json, sys
          lock = json.load(open("tools/supply-chain-lock.json", encoding="utf-8"))
          version = sys.argv[1]
          opencode = lock["opencode"][version]
          opentui_version = opencode["opentui_version"]
          opentui = lock["opentui"][opentui_version]
          print(f"OPENCODE_VERSION={version}")
          print(f"OPENCODE_COMMIT={opencode['commit']}")
          print(f"BUN_VERSION={opencode['bun_version']}")
          print(f"OPENTUI_VERSION={opentui_version}")
          print(f"OPENTUI_COMMIT={opentui['commit']}")
          print(f"ZIG_VERSION={opentui['zig_version']}")
          PY

      - name: Fetch pinned OpenTUI source
        run: |
          set -euo pipefail
          mkdir -p work/opentui
          git -C work/opentui init .
          git -C work/opentui remote add origin https://github.com/anomalyco/opentui.git
          git -C work/opentui fetch --depth=1 origin "$OPENTUI_COMMIT"
          git -C work/opentui checkout --detach FETCH_HEAD
          test "$(git -C work/opentui rev-parse HEAD)" = "$OPENTUI_COMMIT"

      - name: Install hash-verified Zig
        run: |
          set -euo pipefail
          SHA="$(python3 -c 'import json,os; print(json.load(open("tools/supply-chain-lock.json"))["opentui"][os.environ["OPENTUI_VERSION"]]["zig_x86_64_linux_sha256"])')"
          URL="https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          mkdir -p work
          curl --fail --location --retry 3 --retry-all-errors "$URL" -o work/zig.tar.xz
          echo "$SHA  work/zig.tar.xz" | sha256sum -c -
          tar -xJf work/zig.tar.xz -C work
          echo "$GITHUB_WORKSPACE/work/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Verify locked Android toolchain metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          lock = json.load(open("tools/supply-chain-lock.json", encoding="utf-8"))
          bind = json.load(open("tools/transplant/config/bun-bind.json", encoding="utf-8"))
          bun_version = lock["opencode"][os.environ["OPENCODE_VERSION"]]["bun_version"]
          bun = lock["android_bun"][bun_version]
          opentui = lock["opentui"][os.environ["OPENTUI_VERSION"]]
          assert bind["target"] == bun_version
          assert bind["archive_sha256"] == bun["archive_sha256"]
          assert bind["elf_sha256"] == bun["elf_sha256"]
          assert opentui["commit"] == os.environ["OPENTUI_COMMIT"]
          assert opentui["zig_version"] == os.environ["ZIG_VERSION"]
          PY
          test "$(zig version)" = "$ZIG_VERSION"

      - name: Apply Android/Bionic OpenTUI compatibility patches
        run: |
          set -euo pipefail
          python3 tools/patch-opentui-android.py work/opentui
          git -C work/opentui diff --check

      - name: Build Bionic OpenTUI library
        run: |
          set -euo pipefail
          NDK_VERSION="$(python3 -c 'import json; print(json.load(open("tools/supply-chain-lock.json"))["android_ndk_version"])')"
          NDK="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          test -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          ACTUAL_NDK_VERSION="$(sed -n 's/^Pkg.Revision = //p' "$NDK/source.properties" | tr -d '\r')"
          test "$ACTUAL_NDK_VERSION" = "$NDK_VERSION"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIBDIR="$SYSROOT/usr/lib/aarch64-linux-android/$ANDROID_API"
          test -d "$LIBDIR"
          LLVM_STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$LLVM_STRIP"
          echo "LLVM_STRIP=$LLVM_STRIP" >> "$GITHUB_ENV"
          mkdir -p artifacts/transplant/opentui-bionic
          {
            echo "include_dir=$SYSROOT/usr/include/aarch64-linux-android"
            echo "sys_include_dir=$SYSROOT/usr/include"
            echo "crt_dir=$LIBDIR"
            echo "msvc_lib_dir="
            echo "kernel32_lib_dir="
            echo "gcc_dir=$LIBDIR"
            echo "darwin_sdk_dir="
          } > work/android-libc.txt
          sh work/opentui/packages/native/scripts/prepare-zig-deps.sh
          (
            cd work/opentui/packages/native
            OPENTUI_C_REMAP="-ffile-prefix-map=$GITHUB_WORKSPACE=/usr/src -D__ANDROID_MIN_SDK_VERSION__=28 -D__ANDROID_API__=28" \
            BIONIC_ARCH_INCLUDE="$SYSROOT/usr/include/aarch64-linux-android" \
            BIONIC_SYS_INCLUDE="$SYSROOT/usr/include" \
            BIONIC_LIB_DIR="$LIBDIR" \
              zig build -Dlibrary-target=aarch64-linux-android.28 \
                -Doptimize=ReleaseSafe --libc "$GITHUB_WORKSPACE/work/android-libc.txt"
          )
          SO="work/opentui/packages/native/lib/aarch64-linux-android.28/libopentui.so"
          test -s "$SO"
          python3 tools/remap-binary-prefix.py "$SO" "$GITHUB_WORKSPACE" /usr/src
          cp "$SO" artifacts/transplant/opentui-bionic/libopentui.so

      - name: Verify Bionic OpenTUI
        run: |
          set -euo pipefail
          SO=artifacts/transplant/opentui-bionic/libopentui.so
          file "$SO" | grep -q 'ARM aarch64'
          readelf -h "$SO" | grep -q 'Type:.*DYN'
          readelf -d "$SO" | grep -q 'NEEDED.*libc.so'
          # Inspect PT_TLS using wide output: the default readelf layout wraps
          # the program-header columns and is not safe for positional awk fields.
          readelf -lW "$SO"
          readelf -rW "$SO" | grep -E 'TLS|TLSDESC' || true
          # The API-28 TLSDESC fallback allocates zero-filled per-thread blocks.
          # Fail closed if OpenTUI starts shipping initialized (.tdata) TLS.
          readelf -lW "$SO" | awk '
            $1 == "TLS" {
              found = 1
              if ($5 !~ /^0x0+$/) {
                print "OpenTUI PT_TLS has initialized data; TLSDESC fallback cannot copy it." > "/dev/stderr"
                exit 1
              }
            }
            END {
              if (!found) {
                print "OpenTUI PT_TLS segment is missing." > "/dev/stderr"
                exit 1
              }
            }
          '
          if readelf -d "$SO" | grep -q 'libc.so.6'; then
            echo "glibc dependency found in OpenTUI" >&2
            exit 1
          fi
          if readelf -Ws "$SO" | grep -E 'UND[[:space:]]+pthread_tryjoin_np' >/dev/null; then
            echo "glibc-only pthread_tryjoin_np import found" >&2
            exit 1
          fi
          python3 -c 'import sys; sys.path.insert(0,"tools/transplant"); from swap_tui import has_ffi_guard; assert has_ffi_guard(open(sys.argv[1],"rb").read())' "$SO"
          if grep -aFq "$GITHUB_WORKSPACE" "$SO"; then
            echo "build workspace path leaked into OpenTUI" >&2
            exit 1
          fi

      - name: Build OpenCode source bundle and Android native modules
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          bash scripts/ci/build-opencode-bundle.sh
          # Build and verify the first x86_64 native dependency independently.
          # This does not imply that the complete OpenCode bundle supports x86_64.
          TARGET_ARCH=x86_64 NDK="$NDK" ANDROID_API="$ANDROID_API" \
            bash scripts/ci/build-rust-pty-android.sh "$RUNNER_TEMP/librust_pty_x86_64.so"
          readelf -h "$RUNNER_TEMP/librust_pty_x86_64.so" | grep -Eq 'Machine:.*Advanced Micro Devices X86-64'
          readelf -d "$RUNNER_TEMP/librust_pty_x86_64.so" | grep -q 'NEEDED.*libc.so'
          TARGET_ARCH=x86_64 NDK="$NDK" ANDROID_API="$ANDROID_API" \
            bash scripts/ci/build-parcel-watcher-android.sh "work/bundle/$OPENCODE_VERSION/opencode" "$RUNNER_TEMP/watcher_x86_64.node"

      - name: Package and verify the Termux runtime archive
        run: |
          set -euo pipefail
          VERSION="$OPENCODE_VERSION"
          STAGED="artifacts/bundle/$VERSION"
          test -s "$STAGED/lib/index.js"
          mkdir -p dist/bin dist/lib/opencode
          cp -a "$STAGED/lib/." dist/lib/opencode/
          sed "s/__OPENCODE_VERSION__/$VERSION/g" packing/launcher/opencode > dist/bin/opencode
          chmod 0755 dist/bin/opencode
          ARCHIVE="dist/opencode-$VERSION-android-aarch64-bundle.tar.gz"
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -C dist -cf - bin lib | gzip -n > "$ARCHIVE"
          bash scripts/validate-runtime-archive.sh "$ARCHIVE" "$RUNNER_TEMP/archive-validation"
          python3 tools/analyze-runtime-size.py "$ARCHIVE" --top 25
          bash scripts/smoke-test-runtime-archive.sh "$ARCHIVE" "$VERSION" "$RUNNER_TEMP/native-smoke"
          (cd dist && sha256sum "opencode-$VERSION-android-aarch64-bundle.tar.gz" > SHA256SUMS)
          cp "$STAGED/report.json" dist/report.json
          cp tools/supply-chain-lock.json dist/supply-chain-lock.json
          RELEASE_TAG="$(python3 tools/ocver.py tag)"
          python3 - "$VERSION" "$ARCHIVE" "$RELEASE_TAG" > dist/release-checksums.json <<'PY'
          import hashlib, json, sys
          version, path, release_tag = sys.argv[1:]
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
          print(json.dumps({
              "version": version,
              "sourceRepo": "C04-wq/opencode-termux",
              "sourceTag": "v" + version,
              "releaseTag": release_tag,
              "archiveSha256": digest,
              "runtimeId": "android-bionic-bun-v1"
          }, indent=2))
          PY
          cat dist/release-checksums.json
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload candidate for physical Termux validation
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-arm64-candidate-${{ github.sha }}
          path: |
            dist/opencode-*-android-aarch64-bundle.tar.gz
            dist/SHA256SUMS
            dist/report.json
            dist/release-checksums.json
            dist/supply-chain-lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$GITHUB_REF_NAME"
          EXPECTED="$(python3 tools/ocver.py tag)"
          test "$RELEASE_TAG" = "$EXPECTED" || {
            echo "Refusing to publish $RELEASE_TAG; source lock expects $EXPECTED" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "Refusing to publish a commit that is not contained in main." >&2
            exit 1
          }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/opencode-$OPENCODE_VERSION-android-aarch64-bundle.tar.gz" \
            dist/SHA256SUMS dist/report.json dist/supply-chain-lock.json dist/release-checksums.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenCode $OPENCODE_VERSION for Termux (Android/Bionic)" \
            --notes "Built from the pinned official OpenCode source commit recorded in supply-chain-lock.json. Android/Bionic native modules were compiled in this repository's GitHub Actions workflow and verified before publication. See report.json and SHA256SUMS for build provenance and integrity."
          META_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/release-checksums.json?ref=main" --jq .sha)"
          CONTENT="$(base64 -w0 dist/release-checksums.json)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/release-checksums.json" \
            -f message="Switch installer to self-built Android runtime $OPENCODE_VERSION" \
            -f content="$CONTENT" \
            -f sha="$META_SHA" \
            -f branch=main
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=runtime-metadata-updated
